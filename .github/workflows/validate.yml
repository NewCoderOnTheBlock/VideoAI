name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Verify scripts compile
        run: python -m py_compile build_pilot.py build_pilot_alive.py build_pika_upload_clips.py build_rough_cut_from_finals.py extract_runway_keyframes.py render_support.py

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render motion pilot
        run: python build_pilot_alive.py

      - name: Upload pilot artifact
        uses: actions/upload-artifact@v4
        with:
          name: phoenician-pilot-preview-alive
          path: pilot/output/phoenician_pilot_preview_alive.mp4
          if-no-files-found: error
